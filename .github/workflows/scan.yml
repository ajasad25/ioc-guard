name: ioc-guard

on:
  workflow_call:

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out ioc-guard
        uses: actions/checkout@v4
        with:
          repository: ajasad25/ioc-guard
          ref: main
          path: .ioc-guard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan
        env:
          PYTHONPATH: ${{ github.workspace }}/.ioc-guard
        run: |
          set -euo pipefail
          BASE_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE_ARGS="--base-ref origin/${{ github.base_ref }}"
          fi
          set +e
          python3 -m ioc_guard \
            --root "${{ github.workspace }}" \
            --iocs "${{ github.workspace }}/.ioc-guard/iocs.txt" \
            --json "${{ runner.temp }}/ioc-report.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            $BASE_ARGS
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error::ioc-guard failed to run. This is NOT a clean result."
            exit 2
          fi
          if [ "$rc" = "1" ]; then
            echo "::error::ioc-guard found indicators of compromise. Do not merge."
            exit 1
          fi
          echo "ioc-guard: clean"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioc-report
          path: ${{ runner.temp }}/ioc-report.json
          if-no-files-found: ignore
